name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PROMETHEUS_IMAGE: prom/prometheus:v3.15.1
  ALERTMANAGER_IMAGE: prom/alertmanager:v0.34.2
  OTELCOL_IMAGE: otel/opentelemetry-collector-contrib:0.164.0
  LOKI_IMAGE: grafana/loki:3.7.9

jobs:
  lint-and-unit:
    name: lint + unit tests + generated-code drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/requirements*.txt
      - name: Install
        run: |
          pip install -r services/requirements-dev.txt -e "tools/slogen[dev]" yamllint shellcheck-py
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: yamllint
        run: yamllint .
      - name: shellcheck
        run: shellcheck tests/e2e/*.sh scripts/*.sh
      - name: Unit tests (services)
        working-directory: services
        run: pytest -q
      - name: Unit tests (slogen)
        working-directory: tools/slogen
        run: pytest -q
      - name: SLO specs valid, generated PromQL parses
        run: slogen validate --specs slo/specs
      - name: Generated SLO rules are up to date
        run: slogen generate --specs slo/specs --out observability/prometheus/rules/slo --check
      - name: Generated dashboards are up to date
        run: python tools/dashboards/build.py --check

  validate-configs:
    name: validate configs with the real binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: promtool check config (includes every rule file)
        run: |
          docker run --rm -v "$PWD/observability/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool "$PROMETHEUS_IMAGE" check config /etc/prometheus/prometheus.yml
      - name: promtool test rules (alerting unit tests)
        run: |
          docker run --rm -v "$PWD/observability/prometheus:/etc/prometheus:ro" -w /etc/prometheus/tests \
            --entrypoint sh "$PROMETHEUS_IMAGE" -c 'promtool test rules *.test.yml'
      - name: amtool check-config + routing tests
        run: |
          run_amtool() {
            docker run --rm -v "$PWD/observability/alertmanager:/etc/alertmanager:ro" \
              --entrypoint amtool "$ALERTMANAGER_IMAGE" "$@"
          }
          run_amtool check-config /etc/alertmanager/alertmanager.yml
          cfg=--config.file=/etc/alertmanager/alertmanager.yml
          run_amtool config routes test "$cfg" --verify.receivers=pager severity=page slo_id=x
          run_amtool config routes test "$cfg" --verify.receivers=tickets severity=ticket slo_id=x
          run_amtool config routes test "$cfg" --verify.receivers=tickets alertname=Unknown
      - name: otelcol validate
        run: |
          docker run --rm -v "$PWD/observability/otel-collector:/etc/otelcol:ro" \
            "$OTELCOL_IMAGE" validate --config=/etc/otelcol/config.yaml
      - name: loki -verify-config
        run: |
          docker run --rm -v "$PWD/observability/loki:/etc/loki:ro" \
            "$LOKI_IMAGE" -config.file=/etc/loki/loki.yaml -verify-config
      - name: docker compose config
        run: docker compose config -q

  e2e:
    name: e2e (fault injection -> page)
    needs: [lint-and-unit, validate-configs]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Run e2e
        run: tests/e2e/run.sh
      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p diag
          docker compose ps -a > diag/ps.txt
          for s in $(docker compose config --services); do docker compose logs --no-color "$s" > "diag/$s.log" 2>&1 || true; done
          curl -fsS http://localhost:9090/api/v1/targets > diag/prom-targets.json || true
          curl -fsS http://localhost:9090/api/v1/rules > diag/prom-rules.json || true
          curl -fsS http://localhost:9090/api/v1/alerts > diag/prom-alerts.json || true
          curl -fsS http://localhost:9093/api/v2/alerts > diag/am-alerts.json || true
          curl -fsS http://localhost:8085/alerts > diag/alert-sink.json || true
          tail -n 40 diag/*.log
          # Short summary as annotations, visible on the run page without opening logs.
          annotate() { printf '::%s title=%s::%s\n' "$1" "$2" "$(tr '\n' ' ' <<<"$3" | sed 's/%/%25/g' | cut -c1-1800)"; }
          annotate error "targets not up" "$(jq -c '[.data.activeTargets[] | select(.health != "up") | {job: .labels.job, err: .lastError}]' diag/prom-targets.json 2>&1)"
          annotate error "unhealthy rules" "$(jq -c '[.data.groups[].rules[] | select(.health == "err") | {name, err: .lastError}]' diag/prom-rules.json 2>&1)"
          annotate warning "alerts in prometheus" "$(jq -c '[.data.alerts[] | {a: .labels.alertname, s: .labels.severity, st: .state}]' diag/prom-alerts.json 2>&1)"
          annotate warning "compose ps" "$(cat diag/ps.txt)"
          for s in otel-collector tempo loki storefront payments grafana; do
            annotate warning "$s log tail" "$(grep -iE 'error|fail|panic|refused' "diag/$s.log" | tail -n 6)"
          done
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics
          path: diag/
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: docker compose down -v
